# Supabase local development config for the standalone BATO Hardened RAG
# General CKD Information Chatbot. Unlisted settings use CLI defaults.
# See https://supabase.com/docs/guides/local-development/cli/config

project_id = "bato-general-ckd-rag"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Anonymous-first model, matching the reference project: every visitor gets
# an auth.users identity without registering.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.general-chat]
verify_jwt = true

[functions.screening]
verify_jwt = true

[functions.clarify]
verify_jwt = true
